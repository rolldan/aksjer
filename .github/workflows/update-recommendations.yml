name: Oppdater Megleranbefalinger & Publiser GitHub Pages

on:
  schedule:
    # Kjører hver time (5 minutter over hel time, hele døgnet) for ferske kurser, porteføljeverdi og børsmeldinger
    - cron: "5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-recommendations"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hent siste kurser, porteføljeverdi, børsmeldinger og megleranbefalinger
        run: python3 scripts/fetch_recommendations.py

      - name: Commit og push oppdatert recommendations.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet data/recommendations.json; then
            git add data/recommendations.json
            git commit -m "chore(data): oppdater kurser, verdi, børsmeldinger og anbefalinger [skip ci]"
            git push origin HEAD:main
          else
            echo "Ingen nye endringer i data/recommendations.json"
          fi

      - name: Konfigurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Last opp nettsted-artefakt
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publiser til GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
